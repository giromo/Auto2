name: Auto2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1   

    - name: Create directories
      run: mkdir -p logs configs bulk

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Run PHP processor
      run: php Files/process_configs.php > logs/php_run.log 2>&1 || echo "PHP processor failed"

    - name: Check PHP output
      run: |
        if [ -z "$(ls -A configs/)" ]; then
          echo "Error: No files generated in configs/"
          cat logs/php_run.log
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.23'
        cache-dependency-path: Files/go.sum

    - name: Install Go dependencies
      working-directory: ./Files
      run: go mod download

    - name: Build and run Golang file
      working-directory: ./Files
      run: go run ./main.go > ../logs/go_run.log 2>&1 || echo "Go processor failed"

    - name: Move Files to Bulk Directory
      run: |
        mkdir -p bulk
        mv Files/*.txt bulk/ 2>/dev/null || true

    - name: Create merge files
      run: |
        cd bulk
        # merge1
        cat ss_iran.txt ssr_iran.txt trojan_iran.txt > merge1.txt 2>/dev/null || true
        sed -i '/^\(ss:\/\/\|shadowsocks:\/\/\|ssr:\/\/\|trojan:\/\/\)/!d' merge1.txt
        
        # merge2
        cat vmess_iran.txt vless_iran.txt tuic_iran.txt hysteria2_iran.txt wireguard_iran.txt > merge2.txt 2>/dev/null || true
        sed -i '/^\(vmess:\/\/\|vless:\/\/\|tuic:\/\/\|hy2:\/\/\|hysteria2:\/\/\|wireguard:\/\/\)/!d' merge2.txt
        
        # merge3
        cat vmess_iran.txt vless_iran.txt trojan_iran.txt ss_iran.txt ssr_iran.txt tuic_iran.txt hysteria2_iran.txt wireguard_iran.txt > merge3.txt 2>/dev/null || true
        sed -i '/^\(vmess:\/\/\|vless:\/\/\|trojan:\/\/\|ss:\/\/\|ssr:\/\/\|tuic:\/\/\|hy2:\/\/\|hysteria2:\/\/\|wireguard:\/\/\)/!d' merge3.txt

    - name: Convert to base64
      run: |
        cd bulk
        [ -f merge1.txt ] && base64 merge1.txt > b64_merge1.txt || true
        [ -f merge2.txt ] && base64 merge2.txt > b64_merge2.txt || true
        [ -f merge3.txt ] && base64 merge3.txt > b64_merge3.txt || true

    - name: Commit and Push
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        
        git add ./bulk/* ./configs/* ./logs/* || true
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "☠️ $(date '+%Y-%m-%d %H:%M:%S') Collected"
          git pull origin main --rebase
          git push origin main
        fi
